<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom</title>
<style>
body {
  margin: 0;
  background: #10131b;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
header { padding: 65px 15px 30px; }
h1 { font-size: 55px; margin: 0; }
p { color: #aab2c5; }
.search {
  margin: 20px auto 45px;
  max-width: 550px;
  display: flex;
  padding: 8px;
  background: #202637;
  border-radius: 15px;
}
input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border: none;
  outline: none;
  background: transparent;
  color: white;
}
button {
  background: #8295ff;
  border: none;
  border-radius: 10px;
  padding: 12px 20px;
  cursor: pointer;
}
.links {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 20px;
}
.card {
  background: #202637;
  border: 1px solid #343e55;
  border-radius: 18px;
  padding: 30px;
  width: 220px;
  text-decoration: none;
  color: white;
}
.card:hover { background: #303b55; }
.icon { font-size: 40px; }
footer { margin-top: 80px; color: #777; }
</style>
</head>
<body>

<header>
<h1>Classroom</h1>
<p>Your place to start browsing.</p>
</header>

<form class="search" action="https://www.google.com/search" method="GET">
<input name="q" placeholder="Search Google..." required>
<button type="submit">Search</button>
</form>

<h2>Quick Links</h2>

<div class="links">
<a class="card" href="https://www.google.com" target="_blank">
<div class="icon">🔎</div>
<h2>Google</h2>
<p>Search the web</p>
</a>

<a class="card" href="https://www.xbox.com/play" target="_blank">
<div class="icon">🎮</div>
<h2>Xbox Cloud Gaming</h2>
<p>Play Xbox games</p>
</a>
</div>

<footer>
<p>Classroom © 2026</p>
</footer>

</body>
</html>
